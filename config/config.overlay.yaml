# Значения применяются scripts/install.sh через `hermes config set`.
# Telegram token, allowlist и home_channel задаются владельцем отдельно.
model:
  provider: openai-codex
  default: gpt-6-luna
image_gen:
  provider: openai-codex
  model: gpt-image-2-medium
agent:
  max_turns: 30
  reasoning_effort: medium
display:
  language: ru
  busy_input_mode: queue
  platforms:
    telegram:
      # Пропускает один ETA от агента; это не поток мыслей и не журнал инструментов.
      interim_assistant_messages: true
      tool_progress: false
      busy_ack_detail: false
cron:
  wrap_response: false
stt:
  enabled: true
  provider: local_command
  language: ru
